[project]
name = "chatbot-put-it-down-on-paper"
version = "0.1.0"
description = ""
authors = [
    {name = "carlos-dani-dev",email = "carlos.rocha@ufpi.edu.br"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "google-genai (>=2.25.0,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "google (>=3.0.0,<4.0.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "ai (>=0.8.0,<0.9.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "sentry-sdk[fastapi] (>=2.73.0,<3.0.0)"
]


[tool.poetry]
# app, não biblioteca: o Poetry só gerencia as dependências e não tenta instalar o projeto como pacote
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]       # onde procurar os testes
pythonpath = ["."]          # raiz no sys.path: os testes importam `agent...` como o app faz
addopts = "-ra"             # no fim, resume testes pulados/falhos e o motivo
